name: Build Android APK

# Runs automatically on every push to main/master, and can also be
# triggered manually from the Actions tab ("Run workflow" button).
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Optional: if you have your own DanDanPlay / Kazumi mirror API keys,
    # add them as repo secrets (Settings -> Secrets and variables -> Actions)
    # and they'll be picked up automatically here. If you don't set them,
    # the build still succeeds -- you just won't get the DanDanPlay danmaku
    # source or the built-in Bangumi mirror, both of which are optional
    # features the app degrades gracefully without.
    env:
      DANDANAPI_APPID: ${{ secrets.DANDANAPI_APPID }}
      DANDANAPI_KEY: ${{ secrets.DANDANAPI_KEY }}
      KAZUMI_APPID: ${{ secrets.KAZUMI_APPID }}
      KAZUMI_KEY: ${{ secrets.KAZUMI_KEY }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze project (non-fatal, informational only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Build APK (per-ABI, smaller downloads)
        run: >-
          flutter build apk --release --split-per-abi
          --dart-define=DANDANAPI_APPID=$DANDANAPI_APPID
          --dart-define=DANDANAPI_KEY=$DANDANAPI_KEY
          --dart-define=KAZUMI_APPID=$KAZUMI_APPID
          --dart-define=KAZUMI_KEY=$KAZUMI_KEY

      - name: List build output
        run: ls -la build/app/outputs/flutter-apk/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: kazumi-android-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
